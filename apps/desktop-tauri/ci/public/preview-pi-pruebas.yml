name: Preview Pi companion (pruebas)

# HU-054: the WHOLE apps/desktop-pi suite (plus the harness hook config) on real Linux, macOS and Windows, each over its own
# transport (Unix socket on Linux/macOS, named pipe on Windows), with the real Pi installed from npm so the two real-loader
# tests (pi-loader, pi-confirm) RUN on all three OS instead of skipping. Node only: no Rust, no sherpa. Free standard runners.
# Triggers ONLY for branches named preview/*-pruebas.
#
# What this does NOT prove: that the packaged island's native relay talks to a real Pi (the Rust tests and the Windows runtime
# smoke cover the relay); here the island side is a fake receiver on the same transport.
on:
  push:
    branches: ['preview/*-pruebas']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the real Pi (loader tests must run, never skip)
        shell: bash
        run: |
          npm i -g @earendil-works/pi-coding-agent
          ROOT="$(npm root -g)/@earendil-works/pi-coding-agent"
          test -f "$ROOT/dist/core/extensions/loader.js"
          echo "PI_CODING_AGENT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: desktop-pi full suite
        working-directory: apps/desktop-pi
        shell: bash
        run: |
          node --test --test-reporter=tap test/*.test.cjs 2>&1 | tee "$RUNNER_TEMP/pi.log"
          test "${PIPESTATUS[0]}" -eq 0
          # A skip is allowed ONLY by explicit name: the Windows-only twin on Linux/macOS, and the live Unix-pid probe on Windows
          # (its twin is the Windows handoff test). Any other skip, including the real-Pi loader tests, fails the job.
          skipped="$(grep -E '^[[:space:]]*(ok|not ok) [0-9]+ - .*# SKIP' "$RUNNER_TEMP/pi.log" || true)"
          unexpected="$(printf '%s\n' "$skipped" | grep -v '^$' | grep -v -E 'Windows twin: metadata handoff|a live process writing an island-like endpoint.json' || true)"
          echo "skips: ${skipped:-none}"
          if [ -n "$unexpected" ]; then echo "UNEXPECTED SKIP:"; echo "$unexpected"; exit 1; fi
      - name: desktop-harness hook config and installer
        working-directory: apps/desktop-harness
        shell: bash
        run: npm test
