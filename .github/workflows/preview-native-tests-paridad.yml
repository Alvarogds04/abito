name: Preview native tests (paridad)

# Native unit tests of the v0.1.2 platform-parity changes on real
# Windows and macOS: focus hand-back (HU-049), active-window context
# (HU-050) and the motion decision page logic (HU-051).
# Triggers ONLY for branches named preview/*-paridad.
# What this does NOT prove: that the keyboard really returns to the
# previous app, or that the real WebView2/WKWebView report the OS
# reduced-motion setting. Those need a human on a real machine.
on:
  push:
    branches: ['preview/*-paridad']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-paridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop-tauri
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri
          cache-on-failure: true
      - name: Fetch pinned Windows sherpa static library
        run: |
          $text = Get-Content packaging/windows/sherpa-onnx.sha256
          $pin = $text.Trim() -split '\s+'
          $archive = Join-Path $env:RUNNER_TEMP $pin[1]
          $base = 'https://github.com/k2-fsa/sherpa-onnx/releases/download'
          Invoke-WebRequest "$base/v1.13.8/$($pin[1])" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($hash.ToLowerInvariant() -ne $pin[0]) {
            throw 'sherpa archive SHA256 mismatch'
          }
          tar -xjf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = $pin[1] -replace '\.tar\.bz2$', ''
          $lib = Join-Path $env:RUNNER_TEMP "$folder/lib"
          if (-not (Test-Path (Join-Path $lib 'sherpa-onnx-c-api.lib'))) {
            throw 'Pinned sherpa archive lacks sherpa-onnx-c-api.lib'
          }
          "SHERPA_ONNX_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "SHERPA_ONNX_ARCHIVE_DIR=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Focus hand-back and window context (lib crate)
        run: |
          cargo test --locked --lib -- foreground contextwin --nocapture
          exit $LASTEXITCODE
      - name: Motion decision page logic on Windows Node
        if: ${{ !cancelled() }}
        run: |
          node test-node/overview-view-check.cjs
          exit $LASTEXITCODE

      - name: Reduced motion probe (HU-051, Windows webview engine)
        if: ${{ !cancelled() }}
        run: |
          Add-Type -Namespace W -Name S -MemberDefinition @'
          [DllImport("user32.dll", SetLastError=true)]
          public static extern bool SystemParametersInfo(uint a, uint b, ref bool c, uint d);
          [DllImport("user32.dll", SetLastError=true)]
          public static extern bool SystemParametersInfo(uint a, uint b, IntPtr c, uint d);
          '@
          $GET = 0x1042; $SET = 0x1043
          $old = $false
          [void][W.S]::SystemParametersInfo($GET, 0, [ref]$old, 0)
          Write-Host "client-area animations before: $old"
          $html = Join-Path $env:RUNNER_TEMP 'motion.html'
          $js = 'document.body.textContent=' +
            '"REDUCED="+matchMedia("(prefers-reduced-motion: reduce)").matches'
          "<body><script>$js</script></body>" | Set-Content $html
          $url = ([Uri]$html).AbsoluteUri
          $edge = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'msedge.exe not found on the runner' }
          Write-Host "edge: $edge"
          function Probe {
            $prof = Join-Path $env:RUNNER_TEMP ("edge-" + [guid]::NewGuid())
            $out = & $edge --headless=new --disable-gpu --no-first-run `
              --user-data-dir=$prof --virtual-time-budget=3000 `
              --dump-dom $url 2>&1
            Write-Host "edge exit: $LASTEXITCODE"
            ($out | Out-String).Trim()
          }
          try {
            [void][W.S]::SystemParametersInfo($SET, 0, [IntPtr]::Zero, 2)  # off
            $off = Probe
            [void][W.S]::SystemParametersInfo($SET, 0, [IntPtr]1, 2)  # on
            $on = Probe
          } finally {
            [void][W.S]::SystemParametersInfo($SET, 0, [IntPtr][int]$old, 2)
          }
          Write-Host "animations OFF -> $off"
          Write-Host "animations ON  -> $on"
          if ($off -notmatch 'REDUCED=true' -or $on -notmatch 'REDUCED=false') {
            throw 'Chromium/WebView2 did not mirror SPI_CLIENTAREAANIMATION'
          }

  macos:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop-tauri
    env:
      SHERPA_VERSION: "1.13.8"
      SHERPA_SHA256: >-
        9091bf160dc7fdacedbc906b212badf53c2993f4e5277a0e03998e96c31d60da
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch sherpa-onnx static libs (pinned sha256)
        run: |
          set -euo pipefail
          A="sherpa-onnx-v${SHERPA_VERSION}-osx-arm64-static-lib.tar.bz2"
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download"
          curl -fsSL -o "$RUNNER_TEMP/$A" "$URL/v${SHERPA_VERSION}/$A"
          echo "${SHERPA_SHA256}  $RUNNER_TEMP/$A" | shasum -a 256 -c -
          tar -xjf "$RUNNER_TEMP/$A" -C "$RUNNER_TEMP"
          LIB="$RUNNER_TEMP/sherpa-onnx-v${SHERPA_VERSION}-osx-arm64-static-lib"
          echo "SHERPA_ONNX_LIB_DIR=$LIB/lib" >> "$GITHUB_ENV"
      - name: Focus hand-back and window context (lib crate)
        run: |
          cargo test --locked --lib -- foreground contextwin --nocapture
      - name: Motion decision page logic on macOS Node
        if: ${{ !cancelled() }}
        run: |
          node test-node/overview-view-check.cjs
